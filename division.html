<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚽ אלוף הכפל</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--green:#00c853;--dark-green:#007a2f;--yellow:#ffd600;--red:#ff1744;--blue:#1565c0;--white:#fff;--shadow:0 4px 20px rgba(0,0,0,0.18);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--dark-green);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;position:relative;}
body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(90deg,rgba(0,150,50,0.15) 0px,rgba(0,150,50,0.15) 60px,transparent 60px,transparent 120px),linear-gradient(180deg,#1b5e20 0%,#2e7d32 40%,#1b5e20 100%);z-index:0;}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:12px;display:flex;flex-direction:column;align-items:center;}
.header{width:100%;background:rgba(0,0,0,0.45);border-radius:16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);}
.title{font-family:'Fredoka One',cursive;color:var(--yellow);font-size:1.5rem;}
.score-box{display:flex;flex-direction:column;align-items:center;}
.score-val{font-family:'Fredoka One',cursive;color:var(--white);font-size:1.4rem;}
.section-title{font-family:'Fredoka One',cursive;color:var(--yellow);font-size:1.1rem;align-self:flex-start;margin:10px 0 5px;}
.table-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;}
.table-btn{aspect-ratio:1;border-radius:12px;border:3px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.12);color:white;font-family:'Fredoka One',cursive;font-size:1.2rem;cursor:pointer;}
.table-btn.selected{background:var(--yellow);color:#1a1a1a;border-color:var(--yellow);box-shadow:0 0 14px rgba(255,214,0,0.6);}
.table-btn.mixed{grid-column:span 2;aspect-ratio:auto;padding:8px;}
.mode-row{display:flex;gap:10px;width:100%;}
.mode-btn{flex:1;padding:14px 8px;border-radius:14px;border:3px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:white;cursor:pointer;text-align:center;}
.mode-btn.selected{border-color:var(--yellow);background:rgba(255,214,0,0.15);}
.start-btn{width:100%;padding:16px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--yellow),#ff9800);color:#1a1a1a;font-family:'Fredoka One',cursive;font-size:1.3rem;cursor:pointer;margin-top:15px;}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.timer-bar-bg{width:120px;height:10px;background:rgba(255,255,255,0.15);border-radius:10px;overflow:hidden;}
.timer-bar{height:100%;background:var(--green);transition:width 0.1s linear;}
.question-card{width:100%;background:rgba(255,255,255,0.97);border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;}
.question-text{font-family:'Fredoka One',cursive;font-size:3rem;direction: ltr; unicode-bidi: bidi-override;}
.answer-input{font-family:'Fredoka One',cursive;font-size:2rem;width:120px;text-align:center;border:4px solid #ddd;border-radius:16px;padding:8px;}
.submit-btn{width:100%;padding:14px;border-radius:50px;border:none;background:var(--green);color:white;font-family:'Fredoka One',cursive;font-size:1.2rem;cursor:pointer;}
.lp-bar-bg{width:100%;height:8px;background:rgba(255,255,255,0.15);border-radius:8px;margin:10px 0;}
.lp-bar{height:100%;background:var(--yellow);width:0%;transition:width 0.4s;}
.result-card{background:white;padding:30px;border-radius:24px;text-align:center;width:100%;}
.float-emoji{position:fixed;font-size:2rem;pointer-events:none;z-index:999;animation:floatUp 1s forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-120px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake 0.3s;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.pop{animation:pop 0.3s;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <a href="index.html" style="color:rgba(255,255,255,0.4);text-decoration:none;font-size:0.8rem;font-family:'Fredoka One',cursive;">← בית</a>
    <div class="title">⚽ אלוף הכפל</div>
    <div class="score-box">
      <div class="score-label">ניקוד</div>
      <div class="score-val" id="total-score">0</div>
    </div>
  </div>

  <div id="screen-menu" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div class="section-title">🔢 בחר לוח כפל</div>
    <div class="table-grid" id="table-grid"></div>
    <div class="section-title">🎮 מצב משחק</div>
    <div class="mode-row">
      <div class="mode-btn selected" data-mode="practice" onclick="selectMode(this)">📚 אימון</div>
      <div class="mode-btn" data-mode="lives" onclick="selectMode(this)">❤️ חיים</div>
      <div class="mode-btn" data-mode="levels" onclick="selectMode(this)">🏆 שלבים</div>
    </div>
    <button class="start-btn" onclick="startGame()">🚀 יאללה נתחיל!</button>
  </div>

  <div id="screen-game" style="width:100%;display:none;flex-direction:column;align-items:center;gap:12px;">
    <button onclick="goMenu()" style="align-self:flex-start; background:none; border:none; color:white; cursor:pointer;">← חזרה</button>
    <div class="hud">
      <div class="lives" id="lives-display"></div>
      <div class="timer-wrap" id="timer-wrap">
        <div class="timer-bar-bg"><div class="timer-bar" id="timer-bar"></div></div>
        <div class="timer-num" id="timer-num">10</div>
      </div>
      <div class="streak-badge" id="streak-badge">🔥 0 ברצף</div>
    </div>
    <div id="level-badge" style="color:white; font-family:'Fredoka One';"></div>
    <div class="lp-bar-bg"><div class="lp-bar" id="lp-bar"></div></div>
    <div class="question-card" id="question-card">
      <div class="question-text" id="question-text"></div>
      <input class="answer-input" id="answer-input" type="number" placeholder="?">
      <div class="feedback" id="feedback"></div>
      <button class="submit-btn" onclick="submitAnswer()">✔ אישור</button>
    </div>
  </div>

  <div id="screen-result" style="width:100%;display:none;flex-direction:column;align-items:center;gap:12px;">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <h2 id="result-title">כל הכבוד!</h2>
      <p id="stat-summary"></p>
      <button class="start-btn" onclick="goMenu()">🏠 תפריט</button>
    </div>
  </div>
</div>

<script>
var selectedTable = 'mixed', selectedMode = 'practice';
var lives, streak, correct, wrong, sessionScore, level, levelCorrect, questionNum;
var currentAns, timerInterval, timeLeft;

(function initGrid(){
    var grid = document.getElementById('table-grid');
    for(var i=2; i<=10; i++){
        var b = document.createElement('button');
        b.className = 'table-btn'; b.textContent = '×' + i; b.dataset.val = i;
        b.onclick = function(){ selectTable(this); };
        grid.appendChild(b);
    }
    var m = document.createElement('button');
    m.className = 'table-btn mixed selected'; m.textContent = '🎲 מעורב'; m.dataset.val = 'mixed';
    m.onclick = function(){ selectTable(this); };
    grid.appendChild(m);
})();

function selectTable(btn){
    document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedTable = btn.dataset.val === 'mixed' ? 'mixed' : parseInt(btn.dataset.val);
}

function selectMode(btn){
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMode = btn.dataset.mode;
}

function showScreen(id){
    ['screen-menu','screen-game','screen-result'].forEach(s => document.getElementById(s).style.display = 'none');
    document.getElementById(id).style.display = 'flex';
}

function goMenu(){ clearInterval(timerInterval); showScreen('screen-menu'); }

function startGame(){
    lives = 3; streak = 0; correct = 0; wrong = 0; sessionScore = 0; level = 1; levelCorrect = 0; questionNum = 0;
    showScreen('screen-game');
    updateHUD();
    nextQuestion();
}

function nextQuestion(){
    var a = selectedTable === 'mixed' ? Math.floor(Math.random()*9)+2 : selectedTable;
    var b = Math.floor(Math.random()*10)+1;
    if(Math.random() > 0.5) { [a, b] = [b, a]; }
    currentAns = a * b;

    document.getElementById('question-text').innerHTML = `${a} × ${b} = <span style="color:#1565c0">?</span>`;
    document.getElementById('answer-input').value = '';
    document.getElementById('answer-input').focus();
    document.getElementById('feedback').textContent = '';

    if(selectedMode !== 'practice') startTimer(10);
    else document.getElementById('timer-wrap').style.visibility = 'hidden';
}

function startTimer(total){
    document.getElementById('timer-wrap').style.visibility = 'visible';
    clearInterval(timerInterval); timeLeft = total;
    var bar = document.getElementById('timer-bar');
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        var pct = (timeLeft / total) * 100;
        bar.style.width = pct + '%';
        document.getElementById('timer-num').textContent = Math.ceil(timeLeft);
        if(timeLeft <= 0){ clearInterval(timerInterval); handleWrong(true); }
    }, 100);
}

function submitAnswer(){
    var val = parseInt(document.getElementById('answer-input').value);
    if(isNaN(val)) return;
    clearInterval(timerInterval);
    if(val === currentAns) handleCorrect();
    else handleWrong(false);
}

function handleCorrect(){
    streak++; correct++; levelCorrect++; questionNum++;
    sessionScore += 10;
    floatEmoji('⚽');
    document.getElementById('question-card').classList.add('pop');
    setTimeout(() => document.getElementById('question-card').classList.remove('pop'), 300);
    
    if(selectedMode === 'levels' && levelCorrect >= 5){
        level++; levelCorrect = 0;
        floatEmoji('🏆');
    }
    
    updateHUD();
    if(selectedMode === 'practice' && questionNum >= 15) setTimeout(endGame, 800);
    else setTimeout(nextQuestion, 800);
}

function handleWrong(isTimeout){
    streak = 0; wrong++; questionNum++;
    floatEmoji('❌');
    document.getElementById('question-card').classList.add('shake');
    setTimeout(() => document.getElementById('question-card').classList.remove('shake'), 300);
    
    if(selectedMode === 'lives') lives--;
    updateHUD();
    
    if(lives === 0) setTimeout(endGame, 800);
    else setTimeout(nextQuestion, 1200);
}

function updateHUD(){
    var ld = document.getElementById('lives-display');
    if(selectedMode === 'lives'){
        ld.innerHTML = ''; for(var i=0; i<3; i++) ld.innerHTML += i < lives ? '❤️' : '🖤';
    } else ld.innerHTML = '✅ ' + correct;
    
    document.getElementById('streak-badge').textContent = '🔥 ' + streak + ' ברצף';
    document.getElementById('level-badge').textContent = selectedMode === 'levels' ? 'שלב ' + level : '';
    
    var progress = selectedMode === 'levels' ? (levelCorrect/5)*100 : (questionNum/15)*100;
    document.getElementById('lp-bar').style.width = progress + '%';
    document.getElementById('total-score').textContent = sessionScore;
}

function endGame(){
    clearInterval(timerInterval);
    showScreen('screen-result');
    document.getElementById('stat-summary').textContent = `צברת ${sessionScore} נקודות וענית נכון על ${correct} שאלות!`;
}

function floatEmoji(e){
    var el = document.createElement('div'); el.className = 'float-emoji'; el.textContent = e;
    el.style.left = '50%'; el.style.top = '50%'; document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

document.getElementById('answer-input').addEventListener('keypress', function(e){ if(e.key === 'Enter') submitAnswer(); });
</script>
</body>
</html>
