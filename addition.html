<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>➕ חיבור וחיסור</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --main: #1565c0; --light: #42a5f5; --dark: #0d47a1;
  --yellow: #ffd600; --red: #ff1744; --green: #00c853;
  --shadow: 0 4px 20px rgba(0,0,0,0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Heebo', sans-serif;
  background: linear-gradient(160deg, #0d47a1, #1565c0, #1976d2);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  padding: 10px; overflow-x: hidden; position: relative;
}
/* Floating numbers background */
body::before {
  content: '1 2 3 + − = 4 5 6';
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  font-family: 'Fredoka One', cursive; font-size: 4rem;
  color: rgba(255,255,255,0.03); word-break: break-all;
  line-height: 1.2; z-index: 0; pointer-events: none;
  display: flex; align-items: center; overflow: hidden;
}
.wrap { position: relative; z-index: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* Header */
.header { width: 100%; background: rgba(0,0,0,0.3); border-radius: 16px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.1); }
.title { font-family: ‘Fredoka One’, cursive; color: var(–yellow); font-size: 1.4rem; }
.score-box { display: flex; flex-direction: column; align-items: center; }
.score-label { color: rgba(255,255,255,0.5); font-size: 0.65rem; }
.score-val { font-family: ‘Fredoka One’, cursive; color: white; font-size: 1.4rem; }

/* Screens */
.screen { width: 100%; display: none; flex-direction: column; align-items: center; gap: 10px; }
.screen.active { display: flex; }
.section-title { font-family: ‘Fredoka One’, cursive; color: var(–yellow); font-size: 1.05rem; align-self: flex-start; }

/* Difficulty grid */
.diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.diff-btn {
padding: 18px 10px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.15);
background: rgba(255,255,255,0.08); color: white; font-family: ‘Fredoka One’, cursive;
font-size: 1rem; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 6px; backdrop-filter: blur(4px);
}
.diff-btn .di { font-size: 2rem; }
.diff-btn .ds { font-size: 0.7rem; color: rgba(255,255,255,0.5); }
.diff-btn:hover { background: rgba(255,255,255,0.18); transform: translateY(-2px); }
.diff-btn.selected { border-color: var(–yellow); background: rgba(255,214,0,0.12); }

/* Op toggle */
.op-row { display: flex; gap: 10px; width: 100%; }
.op-btn {
flex: 1; padding: 12px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15);
background: rgba(255,255,255,0.08); color: white; font-family: ‘Fredoka One’, cursive;
font-size: 1.2rem; cursor: pointer; transition: all 0.15s;
}
.op-btn.selected { border-color: var(–yellow); background: rgba(255,214,0,0.15); }
.op-btn:hover { background: rgba(255,255,255,0.18); }

.start-btn { width: 100%; padding: 16px; border-radius: 50px; border: none; background: linear-gradient(135deg, var(–yellow), #ff9800); color: #1a1a1a; font-family: ‘Fredoka One’, cursive; font-size: 1.2rem; cursor: pointer; box-shadow: 0 6px 20px rgba(255,152,0,0.4); transition: all 0.15s; }
.start-btn:hover { transform: scale(1.02); }

/* HUD */
.hud { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.lives { font-size: 1.5rem; display: flex; gap: 3px; min-width: 80px; }
.timer-wrap { display: flex; flex-direction: column; align-items: center; }
.timer-bar-bg { width: 110px; height: 10px; background: rgba(255,255,255,0.15); border-radius: 10px; overflow: hidden; }
.timer-bar { height: 100%; border-radius: 10px; background: var(–green); transition: width 0.1s linear, background 0.3s; }
.timer-num { font-family: ‘Fredoka One’, cursive; color: white; font-size: 0.85rem; margin-top: 2px; }
.streak-badge { background: rgba(255,214,0,0.15); border: 2px solid var(–yellow); border-radius: 20px; padding: 4px 10px; color: var(–yellow); font-family: ‘Fredoka One’, cursive; font-size: 0.8rem; min-width: 70px; text-align: center; }

/* Number line visual (for easy mode) */
.number-line-wrap { width: 100%; overflow-x: auto; padding: 6px 0; }
.number-line { display: flex; align-items: center; gap: 0; min-width: max-content; padding: 0 10px; }
.nl-num { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); color: white; font-family: ‘Fredoka One’, cursive; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; }
.nl-num.highlight { background: var(–yellow); color: #1a1a1a; border-color: var(–yellow); transform: scale(1.2); }
.nl-line { width: 10px; height: 2px; background: rgba(255,255,255,0.2); flex-shrink: 0; }

/* Question card */
.question-card {
width: 100%; background: rgba(255,255,255,0.97); border-radius: 24px;
padding: 22px 16px 18px; box-shadow: var(–shadow), 0 0 0 4px rgba(255,214,0,0.15);
display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.question-card.shake { animation: shake 0.4s ease; }
.question-card.pop   { animation: pop   0.3s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 60%{transform:translateX(10px)} 80%{transform:translateX(-6px)} }
@keyframes pop   { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }

.question-text { font-family: ‘Fredoka One’, cursive; font-size: clamp(2.2rem, 9vw, 3rem); color: #1a1a1a; letter-spacing: 3px; text-align: center; }
.question-text .op-plus  { color: #1565c0; }
.question-text .op-minus { color: #c62828; }
.question-text .q-mark   { color: #6a1b9a; }

/* Choices grid */
.choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.choice-btn {
padding: 18px; border-radius: 16px; border: 3px solid #e0e0e0;
background: #f8f8f8; font-family: ‘Fredoka One’, cursive; font-size: 1.6rem;
color: #1a1a1a; cursor: pointer; transition: all 0.12s;
}
.choice-btn:hover { background: #e3f2fd; border-color: var(–main); transform: scale(1.03); }
.choice-btn.correct { background: #e8f5e9; border-color: var(–green); color: #2e7d32; }
.choice-btn.wrong   { background: #ffebee; border-color: var(–red);   color: #c62828; }

.feedback { font-family: ‘Fredoka One’, cursive; font-size: 1rem; min-height: 1.3em; text-align: center; }
.feedback.correct { color: #2e7d32; } .feedback.wrong { color: #c62828; }

/* Progress bar */
.progress-wrap { width: 100%; }
.progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.15); border-radius: 8px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(–yellow), #ff9800); border-radius: 8px; transition: width 0.4s ease; }
.progress-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-align: center; margin-top: 4px; }

/* Result */
.result-card { width: 100%; background: rgba(255,255,255,0.97); border-radius: 24px; padding: 28px 20px; box-shadow: var(–shadow); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.result-emoji { font-size: 4rem; animation: bounce 0.6s ease; }
@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
.result-title { font-family: ‘Fredoka One’, cursive; font-size: 1.7rem; color: #1a1a1a; }
.result-stats { display: flex; gap: 14px; }
.stat-box { display: flex; flex-direction: column; align-items: center; background: #f0f7f0; border-radius: 12px; padding: 10px 14px; }
.stat-num { font-family: ‘Fredoka One’, cursive; font-size: 1.7rem; color: var(–dark); }
.stat-label { font-size: 0.72rem; color: #555; }
.btn-row { display: flex; gap: 10px; width: 100%; }
.btn-back { flex:1; padding:12px; border-radius:50px; border:2px solid rgba(21,101,192,0.3); background:rgba(21,101,192,0.1); color:var(–main); font-family:‘Fredoka One’,cursive; font-size:1rem; cursor:pointer; transition:0.15s; }
.btn-back:hover { background:rgba(21,101,192,0.2); }
.btn-again { flex:1.5; padding:12px; border-radius:50px; border:none; background:linear-gradient(135deg,var(–yellow),#ff9800); color:#1a1a1a; font-family:‘Fredoka One’,cursive; font-size:1rem; cursor:pointer; box-shadow:0 4px 14px rgba(255,152,0,0.4); transition:0.15s; }
.btn-again:hover { transform:scale(1.02); }

.back-btn { align-self:flex-start; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; border-radius:50px; padding:6px 14px; font-family:‘Fredoka One’,cursive; font-size:0.85rem; cursor:pointer; }

.float-emoji { position:fixed; font-size:2rem; pointer-events:none; z-index:999; animation:floatUp 1s ease forwards; }
@keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-120px) scale(1.4)} }
</style>

</head>

<script src="mathapp-shared.js"></script>
<script>
const TOTAL_Q = 10;
let selectedDiff = 1, selectedOp = 'add';
let lives, streak, correct, wrong, sessionScore, sessionMaxStreak;
let currentAns, questionNum;
let timerInterval, timeLeft;
let totalScore = 0;

// Config per difficulty: [max number, time limit]
const DIFF_CONFIG = { 1: [10, 12], 2: [20, 10], 3: [100, 15], 4: [1000, 20] };

function selectDiff(btn) {
document.querySelectorAll(’.diff-btn’).forEach(b => b.classList.remove(‘selected’));
btn.classList.add(‘selected’);
selectedDiff = parseInt(btn.dataset.diff);
}
function selectOp(btn) {
document.querySelectorAll(’.op-btn’).forEach(b => b.classList.remove(‘selected’));
btn.classList.add(‘selected’);
selectedOp = btn.dataset.op;
}

function showScreen(id) {
document.querySelectorAll(’.screen’).forEach(s => s.classList.remove(‘active’));
document.getElementById(id).classList.add(‘active’);
}
function goMenu() { clearInterval(timerInterval); showScreen(‘screen-menu’); }

function startGame() {
lives = 3; streak = 0; correct = 0; wrong = 0; sessionScore = 0; sessionMaxStreak = 0; questionNum = 0;
clearInterval(timerInterval);
showScreen(‘screen-game’);
updateHUD();
nextQuestion();
}

function updateHUD() {
const ld = document.getElementById(‘lives-display’);
ld.innerHTML = ‘’;
for (let i = 0; i < 3; i++) ld.innerHTML += i < lives ? ‘❤️’ : ‘🖤’;
document.getElementById(‘streak-badge’).textContent = streak >= 3 ? `🔥 ${streak} ברצף!` : `🔥 ${streak} ברצף`;
document.getElementById(‘progress-bar’).style.width = (questionNum / TOTAL_Q * 100) + ‘%’;
document.getElementById(‘progress-label’).textContent = `${questionNum} / ${TOTAL_Q}`;
}

function generateQuestion() {
const [maxN] = DIFF_CONFIG[selectedDiff];
let op = selectedOp === ‘mix’ ? (Math.random() < 0.5 ? ‘add’ : ‘sub’) : selectedOp;
let a, b, ans;

if (op === ‘add’) {
a = Math.floor(Math.random() * (maxN - 1)) + 1;
b = Math.floor(Math.random() * (maxN - a)) + 1;
ans = a + b;
} else {
a = Math.floor(Math.random() * (maxN - 1)) + 2;
b = Math.floor(Math.random() * (a - 1)) + 1;
ans = a - b;
}
return { a, b, op, ans };
}

function generateChoices(ans, maxN) {
const choices = new Set([ans]);
while (choices.size < 4) {
const delta = Math.floor(Math.random() * Math.min(10, maxN * 0.3)) + 1;
const wrong = Math.random() < 0.5 ? ans + delta : Math.max(0, ans - delta);
if (wrong !== ans && wrong >= 0) choices.add(wrong);
}
return […choices].sort(() => Math.random() - 0.5);
}

let currentQuestion = null;

function nextQuestion() {
if (questionNum >= TOTAL_Q) { endGame(); return; }
const q = generateQuestion();
currentQuestion = q;
currentAns = q.ans;
const [maxN, timeLim] = DIFF_CONFIG[selectedDiff];

// Number line for easy levels
const nlWrap = document.getElementById(‘nl-wrap’);
if (selectedDiff <= 2) {
nlWrap.style.display = ‘block’;
buildNumberLine(maxN + 1, q.a);
} else {
nlWrap.style.display = ‘none’;
}

const opSymbol = q.op === ‘add’
? `<span class="op-plus">+</span>`
: `<span class="op-minus">−</span>`;
document.getElementById(‘question-text’).innerHTML = `${q.a} ${opSymbol} ${q.b} = <span class="q-mark">?</span>`;

const choices = generateChoices(q.ans, maxN);
const grid = document.getElementById(‘choices-grid’);
grid.innerHTML = ‘’;
choices.forEach(c => {
const btn = document.createElement(‘button’);
btn.className = ‘choice-btn’;
btn.textContent = c;
btn.onclick = () => checkAnswer(c, btn);
grid.appendChild(btn);
});

document.getElementById(‘feedback’).textContent = ‘’;
document.getElementById(‘feedback’).className = ‘feedback’;

clearInterval(timerInterval);
timeLeft = timeLim;
startTimer(timeLim);
updateHUD();
}

function buildNumberLine(max, highlight) {
const nl = document.getElementById(‘number-line’);
nl.innerHTML = ‘’;
for (let i = 0; i <= max; i++) {
if (i > 0) { const line = document.createElement(‘div’); line.className = ‘nl-line’; nl.appendChild(line); }
const num = document.createElement(‘div’);
num.className = ‘nl-num’ + (i === highlight ? ’ highlight’ : ‘’);
num.textContent = i;
nl.appendChild(num);
}
}

function startTimer(total) {
const bar = document.getElementById(‘timer-bar’);
const num = document.getElementById(‘timer-num’);
bar.style.width = ‘100%’; bar.style.background = ‘var(–green)’;
timerInterval = setInterval(() => {
timeLeft -= 0.1;
const pct = Math.max(0, timeLeft / total * 100);
bar.style.width = pct + ‘%’;
num.textContent = Math.ceil(timeLeft);
if (pct < 40) bar.style.background = ‘#ff9800’;
if (pct < 20) bar.style.background = ‘var(–red)’;
if (timeLeft <= 0) { clearInterval(timerInterval); handleWrong(true); }
}, 100);
}

function checkAnswer(val, btn) {
clearInterval(timerInterval);
document.querySelectorAll(’.choice-btn’).forEach(b => b.onclick = null);
if (val === currentAns) {
btn.classList.add(‘correct’);
handleCorrect();
} else {
btn.classList.add(‘wrong’);
// show correct
document.querySelectorAll(’.choice-btn’).forEach(b => { if (parseInt(b.textContent) === currentAns) b.classList.add(‘correct’); });
handleWrong(false);
}
}

function handleCorrect() {
streak++; correct++; questionNum++;
if (streak > sessionMaxStreak) sessionMaxStreak = streak;
const bonus = streak >= 5 ? 3 : streak >= 3 ? 2 : 1;
const pts = 10 * bonus;
sessionScore += pts;
totalScore += pts;
document.getElementById(‘total-score’).textContent = totalScore;
document.getElementById(‘feedback’).textContent = streak >= 3 ? `🔥 +${pts} מדהים!` : `✅ +${pts} נכון!`;
document.getElementById(‘feedback’).className = ‘feedback correct’;
document.getElementById(‘question-card’).classList.add(‘pop’);
setTimeout(() => document.getElementById(‘question-card’).classList.remove(‘pop’), 300);
floatEmoji(streak >= 5 ? ‘🌟’ : ‘✅’);
updateHUD();
if (questionNum >= TOTAL_Q) { setTimeout(endGame, 700); return; }
setTimeout(nextQuestion, 900);
}

function handleWrong(timeout) {
streak = 0; wrong++; questionNum++;
const q = currentQuestion;
const opSym = q.op === ‘add’ ? ‘+’ : ‘−’;
recordMistake(`${q.a} ${opSym} ${q.b} = ${q.ans}`, selectedDiff <= 2 ? ‘חיבור/חיסור עד 20’ : ‘חיבור/חיסור’);
document.getElementById(‘feedback’).textContent = timeout ? `⏰ ${q.a} ${opSym} ${q.b} = ${q.ans}` : `❌ ${q.a} ${opSym} ${q.b} = ${q.ans}`;
document.getElementById(‘feedback’).className = ‘feedback wrong’;
document.getElementById(‘question-card’).classList.add(‘shake’);
setTimeout(() => document.getElementById(‘question-card’).classList.remove(‘shake’), 400);
floatEmoji(‘❌’);
lives–;
if (lives <= 0) { updateHUD(); setTimeout(endGame, 900); return; }
updateHUD();
if (questionNum >= TOTAL_Q) { setTimeout(endGame, 900); return; }
setTimeout(nextQuestion, 1100);
}

function endGame() {
clearInterval(timerInterval);
const topic = selectedOp === ‘add’ ? ‘חיבור’ : selectedOp === ‘sub’ ? ‘חיסור’ : ‘חיבור-חיסור’;
saveSession({ game: ‘addition’, mode: `רמה ${selectedDiff}`, topic, score: sessionScore, correct, wrong, bestStreak: sessionMaxStreak });
const win = lives > 0;
document.getElementById(‘result-emoji’).textContent = sessionScore >= 80 ? ‘🏆’ : win ? ‘⭐’ : ‘💪’;
document.getElementById(‘result-title’).textContent = sessionScore >= 80 ? ‘מדהים! אלוף חיבור! 🎉’ : win ? ‘כל הכבוד! 🎉’ : ‘אל תוותר! 💪’;
document.getElementById(‘stat-correct’).textContent = correct;
document.getElementById(‘stat-wrong’).textContent = wrong;
document.getElementById(‘stat-score’).textContent = sessionScore;
showScreen(‘screen-result’);
}

function floatEmoji(emoji) {
const el = document.createElement(‘div’); el.className = ‘float-emoji’; el.textContent = emoji;
const card = document.getElementById(‘question-card’).getBoundingClientRect();
el.style.left = (card.left + card.width / 2 - 16) + ‘px’; el.style.top = (card.top + 20) + ‘px’;
document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
}

initGameHeader();
</script>
