<!DOCTYPE html>

<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔐 דף הורה</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0f2027;--bg2:#203a43;--bg3:#2c5364;--yellow:#ffd600;--orange:#ff9800;--green:#00c853;--red:#ff1744;--card:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.12);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px;overflow-x:hidden;}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;z-index:1;}
.screen{width:100%;display:none;flex-direction:column;align-items:center;gap:16px;}
.screen.active{display:flex;}
.logo{font-family:'Fredoka One',cursive;font-size:2rem;color:var(--yellow);text-align:center;margin-top:20px;}
.card{width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 20px;backdrop-filter:blur(10px);}
.card h2{font-family:'Fredoka One',cursive;color:white;font-size:1.2rem;margin-bottom:14px;}
.pin-input{width:100%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.2);border-radius:14px;padding:14px;color:white;font-family:'Fredoka One',cursive;font-size:1.8rem;text-align:center;outline:none;letter-spacing:8px;transition:border-color 0.2s;}
.pin-input:focus{border-color:var(--yellow);}
.go-btn{width:100%;padding:14px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--yellow),var(--orange));color:#1a1a1a;font-family:'Fredoka One',cursive;font-size:1.2rem;cursor:pointer;box-shadow:0 6px 20px rgba(255,152,0,0.35);transition:all 0.15s;margin-top:6px;}
.go-btn:hover{transform:scale(1.02);}
.err{color:var(--red);font-size:0.85rem;text-align:center;min-height:1.2em;}
.section-title{font-family:'Fredoka One',cursive;color:var(--yellow);font-size:1rem;align-self:flex-start;margin-bottom:6px;}
.player-tabs{display:flex;flex-wrap:wrap;gap:8px;width:100%;}
.tab{padding:8px 14px;border-radius:50px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);font-family:'Fredoka One',cursive;font-size:0.9rem;cursor:pointer;transition:all 0.15s;}
.tab.active{border-color:var(--yellow);background:rgba(255,214,0,0.12);color:var(--yellow);}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;}
.stat-box{background:rgba(255,255,255,0.06);border-radius:14px;padding:10px 6px;text-align:center;border:1px solid rgba(255,255,255,0.08);}
.stat-num{font-family:'Fredoka One',cursive;color:var(--yellow);font-size:1.4rem;}
.stat-lbl{color:rgba(255,255,255,0.4);font-size:0.65rem;margin-top:2px;}
.leaderboard{width:100%;}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);}
.lb-row.gold{background:rgba(255,214,0,0.1);border-color:rgba(255,214,0,0.25);}
.lb-rank{font-family:'Fredoka One',cursive;color:rgba(255,255,255,0.4);font-size:1rem;width:24px;text-align:center;}
.lb-avatar{font-size:1.4rem;}
.lb-name{font-family:'Fredoka One',cursive;color:white;font-size:1rem;flex:1;}
.lb-score{font-family:'Fredoka One',cursive;color:var(--yellow);font-size:1rem;}
.table-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%;}
.tg-cell{background:rgba(255,255,255,0.05);border-radius:10px;padding:6px 4px;text-align:center;border:1px solid rgba(255,255,255,0.07);}
.tg-label{color:rgba(255,255,255,0.5);font-size:0.65rem;}
.tg-acc{font-family:'Fredoka One',cursive;font-size:0.9rem;}
.tg-acc.good{color:var(--green);}
.tg-acc.ok{color:var(--yellow);}
.tg-acc.bad{color:var(--red);}
.tg-acc.none{color:rgba(255,255,255,0.2);}
.mistakes-list{width:100%;display:flex;flex-direction:column;gap:6px;}
.mistake-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,0.05);border-radius:10px;border:1px solid rgba(255,255,255,0.07);}
.mistake-q{font-family:'Fredoka One',cursive;color:white;font-size:0.9rem;}
.mistake-cnt{background:rgba(255,23,68,0.2);border:1px solid rgba(255,23,68,0.3);border-radius:20px;padding:2px 8px;color:var(--red);font-size:0.75rem;font-weight:bold;}
.history-list{width:100%;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto;}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,0.05);border-radius:10px;border:1px solid rgba(255,255,255,0.07);}
.hist-game{font-family:'Fredoka One',cursive;color:white;font-size:0.85rem;}
.hist-score{font-family:'Fredoka One',cursive;color:var(--yellow);font-size:0.85rem;}
.hist-date{color:rgba(255,255,255,0.35);font-size:0.7rem;}
.back-link{color:rgba(255,255,255,0.3);font-size:0.8rem;text-decoration:none;align-self:flex-start;}
.back-link:hover{color:rgba(255,255,255,0.6);}
.empty-msg{color:rgba(255,255,255,0.3);font-size:0.9rem;text-align:center;padding:16px;}
.acc-bar-bg{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:6px;overflow:hidden;margin-top:4px;}
.acc-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),#00bfa5);transition:width 0.5s ease;}
</style>
</head>

<script>
var DEFAULT_PWD = '1234';
function getPlayers(){try{return JSON.parse(localStorage.getItem('mathapp_players')||'{}')}catch{return{}}}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}

// PIN
document.getElementById(‘pin-btn’).addEventListener(‘click’, checkPin);
document.getElementById(‘pin-input’).addEventListener(‘keydown’, function(e){if(e.key===‘Enter’)checkPin();});
function checkPin(){
var val = document.getElementById(‘pin-input’).value.replace(/[^0-9a-zA-Z]/g,’’).trim();
if(val === DEFAULT_PWD){ showScreen(‘screen-dash’); buildDash(); }
else { document.getElementById(‘pin-err’).textContent = ‘❌ סיסמה שגויה. נסה שוב.’; }
}

var currentPlayer = null;

function buildDash(){
var players = getPlayers();
var names = Object.keys(players);

// Leaderboard
var lb = document.getElementById(‘leaderboard’);
lb.innerHTML = ‘’;
if(!names.length){ lb.innerHTML=’<div class="empty-msg">אין שחקנים עדיין</div>’; return; }
var sorted = names.slice().sort(function(a,b){return (players[b].totalScore||0)-(players[a].totalScore||0);});
sorted.forEach(function(name, i){
var d = players[name];
var row = document.createElement(‘div’);
row.className = ‘lb-row’+(i===0?’ gold’:’’);
var medal = i===0?‘🥇’:i===1?‘🥈’:i===2?‘🥉’:(i+1)+’’;
row.innerHTML = ‘<div class="lb-rank">’+medal+’</div><div class="lb-avatar">’+d.avatar+’</div><div class="lb-name">’+name+’</div><div class="lb-score">’+( d.totalScore||0)+’</div>’;
lb.appendChild(row);
});

// Player tabs
var tabs = document.getElementById(‘player-tabs’);
tabs.innerHTML = ‘’;
names.forEach(function(name){
var btn = document.createElement(‘button’);
btn.className = ‘tab’;
btn.textContent = players[name].avatar+’ ‘+name;
btn.addEventListener(‘click’, function(){
document.querySelectorAll(’.tab’).forEach(function(t){t.classList.remove(‘active’);});
btn.classList.add(‘active’);
showPlayerStats(name);
});
tabs.appendChild(btn);
});

// Show first player by default
if(names.length > 0){
tabs.querySelector(’.tab’).classList.add(‘active’);
showPlayerStats(names[0]);
}
}

function showPlayerStats(name){
currentPlayer = name;
var players = getPlayers();
var d = players[name];
if(!d) return;

// Stats
document.getElementById(‘stats-card’).style.display = ‘block’;
document.getElementById(‘stats-name’).textContent = d.avatar+’ ‘+name;
document.getElementById(‘s-games’).textContent = d.games||0;
document.getElementById(‘s-correct’).textContent = d.correct||0;
document.getElementById(‘s-streak’).textContent = d.bestStreak||0;
document.getElementById(‘s-score’).textContent = d.totalScore||0;
var total = (d.correct||0)+(d.wrong||0);
var acc = total>0?Math.round((d.correct||0)/total*100):0;
document.getElementById(‘s-acc-pct’).textContent = acc+’%’;
document.getElementById(‘s-acc-bar’).style.width = acc+’%’;

// Table accuracy
var ts = d.tableStats||{};
var tableKeys = Object.keys(ts).filter(function(k){return k.startsWith(‘×’);});
var tableCard = document.getElementById(‘table-card’);
if(tableKeys.length > 0){
tableCard.style.display = ‘block’;
var grid = document.getElementById(‘table-grid’);
grid.innerHTML = ‘’;
for(var i=2; i<=10; i++){
var key = ‘×’+i;
var cell = document.createElement(‘div’);
cell.className = ‘tg-cell’;
var cell_data = ts[key];
if(cell_data && (cell_data.correct+cell_data.wrong)>0){
var a = Math.round(cell_data.correct/(cell_data.correct+cell_data.wrong)*100);
var cls = a>=90?‘good’:a>=70?‘ok’:‘bad’;
cell.innerHTML = ‘<div class="tg-label">×’+i+’</div><div class="tg-acc '+cls+'">’+a+’%</div>’;
} else {
cell.innerHTML = ‘<div class="tg-label">×’+i+’</div><div class="tg-acc none">—</div>’;
}
grid.appendChild(cell);
}
} else {
tableCard.style.display = ‘none’;
}

// Mistakes
var mm = d.mistakeMap||{};
var mistakeKeys = Object.keys(mm);
var mistCard = document.getElementById(‘mistakes-card’);
if(mistakeKeys.length > 0){
mistCard.style.display = ‘block’;
var list = document.getElementById(‘mistakes-list’);
list.innerHTML = ‘’;
var sorted = mistakeKeys.slice().sort(function(a,b){return mm[b]-mm[a];}).slice(0,8);
sorted.forEach(function(k){
var row = document.createElement(‘div’);
row.className = ‘mistake-row’;
row.innerHTML = ‘<span class="mistake-q">’+k+’</span><span class="mistake-cnt">’+mm[k]+‘x</span>’;
list.appendChild(row);
});
} else {
mistCard.style.display = ‘none’;
}

// History
var sessions = d.sessions||[];
var histCard = document.getElementById(‘history-card’);
if(sessions.length > 0){
histCard.style.display = ‘block’;
var hlist = document.getElementById(‘history-list’);
hlist.innerHTML = ‘’;
var recent = sessions.slice().reverse().slice(0,20);
recent.forEach(function(s){
var row = document.createElement(‘div’);
row.className = ‘hist-row’;
var gameIcon = s.game===‘times-tables’?‘⚽’:s.game===‘division’?‘➗’:s.game===‘percentages’?’%’:s.game===‘sudoku’?‘🧩’:‘➕’;
var date = new Date(s.ts);
var dateStr = date.getDate()+’/’+(date.getMonth()+1)+’ ‘+date.getHours()+’:’+String(date.getMinutes()).padStart(2,‘0’);
row.innerHTML = ‘<span class="hist-game">’+gameIcon+’ ‘+(s.topic||s.game)+’</span><span class="hist-score">’+s.score+’ נק׳</span><span class="hist-date">’+dateStr+’</span>’;
hlist.appendChild(row);
});
} else {
histCard.style.display = ‘none’;
}
}
</script>

</body>
