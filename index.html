<script>
var AV=['⭐','🦁','🐯','🦊','🐺','🦅','🐬','🦋','🌟','🔥'];
function gp(){try{return JSON.parse(localStorage.getItem('mathapp_players')||'{}')}catch(e){return{}}}
function sp(p){localStorage.setItem('mathapp_players',JSON.stringify(p))}
function gc(){return localStorage.getItem('mathapp_current')||''}
function sc(n){localStorage.setItem('mathapp_current',n)}
function mk(name){var p=gp();if(!p[name]){p[name]={avatar:AV[Object.keys(p).length%AV.length],totalScore:0,games:0,correct:0,wrong:0,bestStreak:0,sessions:[],tableStats:{},mistakeMap:{}};sp(p);}return p[name];}

function enterApp(){
var name=(document.getElementById('inp').value||'').trim();
if(!name)name='שחקן';
sc(name);mk(name);goMain(name);
}

function goMain(name){
var d=mk(name);
// תיקון כאן: שימוש בגרשיים רגילים וחיבור מחרוזות תקין
document.getElementById('wname').textContent = 'שלום, ' + name + '!';
document.getElementById('wavatar').textContent = d.avatar;
document.getElementById('wscore').textContent = d.totalScore || 0;
document.getElementById('s1').textContent = d.games || 0;
document.getElementById('s2').textContent = d.correct || 0;
document.getElementById('s3').textContent = d.bestStreak || 0;
document.getElementById('s4').textContent = d.totalScore || 0;
document.getElementById('pg-name').style.display = 'none';
document.getElementById('pg-main').style.display = 'flex';
}

function doSwitch(){
document.getElementById('inp').value='';
document.getElementById('pg-main').style.display='none';
document.getElementById('pg-name').style.display='flex';
buildChips();
}

function buildChips(){
var p=gp(),names=Object.keys(p);
var el=document.getElementById('chips');
var or=document.getElementById('or-div');
el.innerHTML='';
if(!names.length){or.style.display='none';return;}
or.style.display='block';
names.forEach(function(name){
var b=document.createElement('button');
b.className='chip';
b.textContent=(p[name].avatar||'⭐')+' '+name;
b.addEventListener('touchend',function(e){e.preventDefault();document.getElementById('inp').value=name;enterApp();});
b.addEventListener('click',function(){document.getElementById('inp').value=name;enterApp();});
el.appendChild(b);
});
}

// כפתור ראשי
var btn=document.getElementById('gobtn');
btn.addEventListener('touchend',function(e){e.preventDefault();enterApp();});
btn.addEventListener('click',function(){enterApp();});

// כפתור החלף
var sw=document.getElementById('swbtn');
sw.addEventListener('touchend',function(e){e.preventDefault();doSwitch();});
sw.addEventListener('click',function(){doSwitch();});

// Enter מהמקלדת
document.getElementById('inp').addEventListener('keydown',function(e){
if(e.key==='Enter'){e.preventDefault();enterApp();}
});

buildChips();
var cur=gc();
if(cur&&gp()[cur]){goMain(cur);}
</script>
