<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>% אחוזים</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#e65100;--dark:#bf360c;--yellow:#ffd600;--red:#ff1744;--green:#00c853;--shadow:0 4px 20px rgba(0,0,0,0.2);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:linear-gradient(160deg,#bf360c,#e65100,#f57c00);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden;}
.wrap{position:relative;z-index:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.header{width:100%;background:rgba(0,0,0,0.3);border-radius:16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.1);}
.title{font-family:'Fredoka One',cursive;color:var(--yellow);font-size:1.4rem;}
.score-box{display:flex;flex-direction:column;align-items:center;}
.score-val{font-family:'Fredoka One',cursive;color:white;font-size:1.4rem;}
.section-title{font-family:'Fredoka One',cursive;color:var(--yellow);font-size:1.05rem;align-self:flex-start;margin:5px 0;}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
.type-btn{padding:14px 10px;border-radius:16px;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:white;font-family:'Fredoka One',cursive;font-size:0.9rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;}
.type-btn.selected{border-color:var(--yellow);background:rgba(255,214,0,0.12);}
.type-btn.full{grid-column:span 2;}
.start-btn{width:100%;padding:16px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--yellow),#ff9800);color:#1a1a1a;font-family:'Fredoka One',cursive;font-size:1.2rem;cursor:pointer;box-shadow:0 6px 20px rgba(255,152,0,0.4);}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;}
.lives{font-size:1.5rem;display:flex;gap:3px;min-width:80px;}
.timer-bar-bg{width:110px;height:10px;background:rgba(255,255,255,0.15);border-radius:10px;overflow:hidden;}
.timer-bar{height:100%;border-radius:10px;background:var(--green);transition:width 0.1s linear;}
.pct-visual{width:100%;background:rgba(255,255,255,0.08);border-radius:16px;padding:12px 14px;}
.pct-bar-outer{width:100%;height:20px;background:rgba(255,255,255,0.15);border-radius:10px;overflow:hidden;}
.pct-bar-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--yellow),#ff9800);transition:width 0.5s ease;}
.question-card{width:100%;background:rgba(255,255,255,0.97);border-radius:24px;padding:20px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px;}
.question-text{font-family:'Fredoka One',cursive;font-size:1.5rem;color:#1a1a1a;text-align:center;direction:rtl;}
.question-text span.num { direction: ltr; display: inline-block; font-weight: 900; }
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;}
.choice-btn{padding:14px 8px;border-radius:16px;border:3px solid #e0e0e0;background:#f8f8f8;font-family:'Fredoka One',cursive;font-size:1.3rem;cursor:pointer;direction: ltr;}
.choice-btn.correct{background:#e8f5e9;border-color:var(--green);color:#2e7d32;}
.choice-btn.wrong{background:#ffebee;border-color:var(--red);color:#c62828;}
.lp-bar-bg{width:100%;height:8px;background:rgba(255,255,255,0.15);border-radius:8px;overflow:hidden;margin-top:10px;}
.lp-bar{height:100%;background:var(--yellow);width:0%;transition:width 0.4s;}
.float-emoji{position:fixed;font-size:2rem;pointer-events:none;z-index:999;animation:floatUp 1s forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-120px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake 0.3s;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.pop{animation:pop 0.3s;}
.no-timer-btn { background: none; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; margin-top: 5px; opacity: 0.8; }
.no-timer-btn.active { background: white; color: var(--main); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <a href="index.html" style="color:rgba(255,255,255,0.4);text-decoration:none;font-size:0.8rem;">← בית</a>
    <div class="title">% אחוזים</div>
    <div class="score-box"><div class="score-val" id="total-score">0</div></div>
  </div>

  <div id="screen-menu" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;">
    <div class="section-title">📋 סוג תרגיל</div>
    <div class="type-grid">
      <button class="type-btn" data-type="find_pct" onclick="selectType(this)"><span class="ti">🔢</span>מה האחוז?</button>
      <button class="type-btn" data-type="find_part" onclick="selectType(this)"><span class="ti">🍕</span>מה החלק?</button>
      <button class="type-btn" data-type="find_whole" onclick="selectType(this)"><span class="ti">🔍</span>מה השלם?</button>
      <button class="type-btn" data-type="sale" onclick="selectType(this)"><span class="ti">🏷️</span>הנחה</button>
      <button class="type-btn full selected" data-type="mix" onclick="selectType(this)"><span class="ti">🎲</span> מעורב</button>
    </div>
    <button class="no-timer-btn" id="no-timer-toggle" onclick="toggleTimer()">⏲️ טיימר: מופעל</button>
    <button class="start-btn" onclick="startGame()">🚀 יאללה נתחיל!</button>
  </div>

  <div id="screen-game" style="width:100%;display:none;flex-direction:column;align-items:center;gap:10px;">
    <button class="back-btn" onclick="goMenu()">← חזרה</button>
    <div class="hud">
      <div class="lives" id="lives-display"></div>
      <div class="timer-wrap" id="timer-container">
        <div class="timer-bar-bg"><div class="timer-bar" id="timer-bar"></div></div>
        <div class="timer-num" id="timer-num">20</div>
      </div>
      <div class="streak-badge" id="streak-badge">🔥 0 ברצף</div>
    </div>
    <div class="pct-visual">
      <div class="pct-bar-outer"><div class="pct-bar-fill" id="pct-bar-fill"></div></div>
      <div class="pct-label-center" id="pct-label-center" style="color:white; text-align:center; margin-top:5px; font-family:'Fredoka One';">50%</div>
    </div>
    <div class="question-card" id="question-card">
      <div class="question-text" id="question-text"></div>
      <div class="choices-grid" id="choices-grid"></div>
      <div class="feedback" id="feedback" style="min-height:20px; font-weight:bold;"></div>
    </div>
    <div style="width:100%">
      <div class="lp-bar-bg"><div class="lp-bar" id="lp-bar"></div></div>
    </div>
  </div>

  <div id="screen-result" style="width:100%;display:none;flex-direction:column;align-items:center;gap:10px;">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">⭐</div>
      <h2 id="result-title">כל הכבוד!</h2>
      <div class="result-stats" id="result-stats" style="margin:15px 0;"></div>
      <button class="start-btn" onclick="goMenu()">🏠 חזרה לתפריט</button>
    </div>
  </div>
</div>

<script>
var TOTAL_Q = 10, TIME_LIMIT = 20;
var NICE_PCTS = [10, 20, 25, 50, 75];
var NICE_WHOLES = [20, 40, 50, 60, 80, 100, 200, 500];
var selectedType = 'mix', isTimerDisabled = false;
var lives, streak, correct, wrong, questionNum, currentAns, timerInterval, timeLeft, sessionScore = 0;

function toggleTimer() {
    isTimerDisabled = !isTimerDisabled;
    const btn = document.getElementById('no-timer-toggle');
    btn.textContent = isTimerDisabled ? "⏲️ טיימר: כבוי" : "⏲️ טיימר: מופעל";
    btn.classList.toggle('active', isTimerDisabled);
}

function selectType(btn) {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedType = btn.dataset.type;
}

function showScreen(id) {
    ['screen-menu', 'screen-game', 'screen-result'].forEach(s => document.getElementById(s).style.display = 'none');
    document.getElementById(id).style.display = 'flex';
}

function goMenu() { clearInterval(timerInterval); showScreen('screen-menu'); }

function startGame() {
    lives = 3; streak = 0; correct = 0; wrong = 0; questionNum = 0; sessionScore = 0;
    showScreen('screen-game');
    nextQuestion();
}

function nextQuestion() {
    if (questionNum >= TOTAL_Q) { endGame(); return; }
    updateHUD();
    
    var types = ['find_pct', 'find_part', 'find_whole', 'sale'];
    var type = selectedType === 'mix' ? types[Math.floor(Math.random()*types.length)] : selectedType;
    var w = NICE_WHOLES[Math.floor(Math.random()*NICE_WHOLES.length)];
    var p = NICE_PCTS[Math.floor(Math.random()*NICE_PCTS.length)];
    var part = (w * p) / 100;
    
    var qText = "", qAns = 0, visualPct = p;

    if(type === 'find_pct') {
        qText = `המספר <span class="num">${part}</span> מתוך <span class="num">${w}</span> הוא כמה אחוזים?`;
        qAns = p;
    } else if(type === 'find_part') {
        qText = `כמה זה <span class="num">${p}%</span> מתוך <span class="num">${w}</span>?`;
        qAns = part;
    } else if(type === 'find_whole') {
        qText = `המספר <span class="num">${part}</span> הוא <span class="num">${p}%</span> מאיזה שלם?`;
        qAns = w;
    } else {
        var salePrice = w - part;
        qText = `מוצר עולה <span class="num">₪${w}</span>. יש הנחה של <span class="num">${p}%</span>. כמה נשלם?`;
        qAns = salePrice;
    }

    currentAns = qAns;
    document.getElementById('question-text').innerHTML = qText;
    document.getElementById('pct-bar-fill').style.width = visualPct + "%";
    document.getElementById('pct-label-center').textContent = visualPct + "%";
    document.getElementById('feedback').textContent = "";
    
    genChoices(qAns, type);

    if(!isTimerDisabled) startTimer();
    else document.getElementById('timer-container').style.visibility = 'hidden';
}

function genChoices(ans, type) {
    var choices = [ans];
    while(choices.length < 4) {
        var dev = Math.floor(ans * (0.2 + Math.random() * 0.5)) + 1;
        var opt = Math.random() > 0.5 ? ans + dev : Math.max(0, ans - dev);
        if(!choices.includes(opt)) choices.push(opt);
    }
    choices.sort(() => Math.random() - 0.5);
    
    var grid = document.getElementById('choices-grid');
    grid.innerHTML = '';
    choices.forEach(c => {
        var btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = type === 'find_pct' ? c + '%' : '₪' + c;
        btn.onclick = () => checkAnswer(c, btn);
        grid.appendChild(btn);
    });
}

function startTimer() {
    clearInterval(timerInterval);
    document.getElementById('timer-container').style.visibility = 'visible';
    timeLeft = TIME_LIMIT;
    var bar = document.getElementById('timer-bar');
    timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        var pct = (timeLeft / TIME_LIMIT) * 100;
        bar.style.width = pct + "%";
        document.getElementById('timer-num').textContent = Math.ceil(timeLeft);
        if(timeLeft <= 0) { clearInterval(timerInterval); handleWrong(true); }
    }, 100);
}

function checkAnswer(val, btn) {
    clearInterval(timerInterval);
    if(val === currentAns) {
        btn.classList.add('correct');
        handleCorrect();
    } else {
        btn.classList.add('wrong');
        handleWrong(false);
    }
}

function handleCorrect() {
    correct++; streak++; questionNum++;
    sessionScore += 10;
    floatEmoji('✅');
    document.getElementById('question-card').classList.add('pop');
    setTimeout(() => {
        document.getElementById('question-card').classList.remove('pop');
        nextQuestion();
    }, 600);
}

function handleWrong(isTimeout) {
    wrong++; streak = 0; questionNum++; lives--;
    floatEmoji('❌');
    document.getElementById('question-card').classList.add('shake');
    if(lives <= 0) setTimeout(endGame, 600);
    else setTimeout(() => {
        document.getElementById('question-card').classList.remove('shake');
        nextQuestion();
    }, 1000);
}

function updateHUD() {
    var ld = document.getElementById('lives-display');
    ld.innerHTML = ''; for(var i=0; i<3; i++) ld.innerHTML += i < lives ? '❤️' : '🖤';
    document.getElementById('streak-badge').textContent = "🔥 " + streak + " ברצף";
    document.getElementById('lp-bar').style.width = (questionNum / TOTAL_Q * 100) + "%";
    document.getElementById('total-score').textContent = sessionScore;
}

function endGame() {
    showScreen('screen-result');
    document.getElementById('result-stats').textContent = `דיוק: ${Math.round((correct/TOTAL_Q)*100)}% | ניקוד: ${sessionScore}`;
}

function floatEmoji(e) {
    var el = document.createElement('div'); el.className = 'float-emoji'; el.textContent = e;
    el.style.left = "50%"; el.style.top = "50%"; document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}
</script>
</body>
</html>
